name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"   # daily
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#b15f2c&color_dots=#ebedf0,#f3d3bd,#e6a77c,#cf8047,#97501f
            dist/snake-dark.svg?palette=github-dark&color_snake=#e8a36b&color_dots=#161b22,#4a2e1c,#7a4626,#cf8047,#f5c79d

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
