  <text x="28" y="76" font-size="26" font-weight="700" fill="#1f2328">SaathiFy</text>
  <text x="28" y="108" font-size="14" fill="#59636e">Real-time, two-way Indian Sign Language platform.</text><text x="28" y="130" font-size="14" fill="#59636e">Speech → ISL on a 3D avatar (1000+ signs); sign → speech</text><text x="28" y="152" font-size="14" fill="#59636e">via MediaPipe + LSTM, piped into a virtual mic for Meet/Zoom.</text>
  <text x="28" y="190" font-size="13.5" font-weight="600" fill="#1f2328">🏆 CraftNCode state winner  ·  Top 13 / 636 at HACKX 4.0</text>
